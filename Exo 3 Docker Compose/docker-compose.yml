services:
  tor:
    image: dperson/torproxy
    container_name: tor
    restart: unless-stopped
    expose:
      - "9050"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - tor

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
